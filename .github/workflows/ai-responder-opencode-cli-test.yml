---
name: OpenCode CLI responder test

# Temporary check that the official OpenCode CLI can answer with a free
# Zen model from GitHub Actions. Remove this workflow after the draft PR
# records the result. It does not post comments.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - cursor/opencode-cli-responder-2a51

permissions:
  contents: read

jobs:
  opencode-cli-dry-run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.head_ref, 'opencode-cli-responder')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install "requests==2.32.3"

      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Dry-run responder through the OpenCode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: big-pickle
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          EVENT_TYPE: dry_run
          OPENCODE_RUN_TIMEOUT: "240"
          AI_RESPONDER_PROMPT: >-
            Reply with exactly this sentence and nothing else:
            OpenCode CLI dry run acknowledged.
        run: |
          set -o pipefail
          if [ -z "${OPENCODE_API_KEY}" ]; then
            echo "OPENCODE_API_KEY is empty; the official CLI cannot authenticate."
            exit 1
          fi
          if [ -n "${GOOGLE_CREDS}" ]; then
            printf '%s\n' "${GOOGLE_CREDS}" > /tmp/gcloud-credentials.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud-credentials.json
          fi
          opencode --version
          set +e
          python ai-responder.py 2>&1 | tee opencode-cli-dry-run.log
          status="${PIPESTATUS[0]}"
          set -e
          if grep -q "OPENCODE_CLI_RESULT status=ok" opencode-cli-dry-run.log; then
            echo "OpenCode CLI produced a reply."
          elif grep -q "OPENCODE_CLI_RESULT status=refused" opencode-cli-dry-run.log; then
            echo "OpenCode CLI refused the request. The log has the exact error."
          else
            echo "OpenCode CLI did not report a result."
            exit 1
          fi
          exit "${status}"

      - name: Upload dry-run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-dry-run
          path: opencode-cli-dry-run.log
          if-no-files-found: warn
