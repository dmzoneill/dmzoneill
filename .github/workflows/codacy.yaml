name: Codacy Security Scan (reusable)

# Called by the codacy.yml stub that setup.sh distributes to each repo.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30 # whole job; the CLI step has its own 20 min limit
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Codacy token
        id: check_token
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          if [ -n "$CODACY_API_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::CODACY_API_TOKEN is not available; Codacy scan skipped."
          fi

      - name: Run Codacy Analysis CLI
        if: steps.check_token.outputs.has_token == 'true'
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        # CLI 7.x can stall inside a tool container (seen with trivy in
        # Leecharr) until GitHub cancels the run after 6h. Normal scans take
        # about 10 minutes, so stop the step well before the job timeout.
        timeout-minutes: 20
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results file
        if: steps.check_token.outputs.has_token == 'true' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: results.sarif
