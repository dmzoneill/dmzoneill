name: CodeQL Analysis (reusable)

# Called by the codeql.yml stub that setup.sh distributes to each repo.
# Languages are detected at runtime from the repository languages API.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Map repository languages to CodeQL languages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/languages" --jq 'keys[]' > languages.txt || true
          python3 - <<'PY'
          import json
          import os

          mapping = {
              "C": "c-cpp",
              "C++": "c-cpp",
              "C#": "csharp",
              "Go": "go",
              "Java": "java-kotlin",
              "Kotlin": "java-kotlin",
              "JavaScript": "javascript-typescript",
              "TypeScript": "javascript-typescript",
              "Vue": "javascript-typescript",
              "Python": "python",
              "Ruby": "ruby",
          }
          with open("languages.txt", encoding="utf-8") as handle:
              found = {mapping[line.strip()] for line in handle if line.strip() in mapping}
          found.add("actions")
          languages = json.dumps(sorted(found))
          print(f"CodeQL languages: {languages}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"languages={languages}\n")
          PY

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ (matrix.language == 'c-cpp' || matrix.language == 'go') && 'autobuild' || 'none' }}
          queries: security-extended,security-and-quality
          config-file: ${{ hashFiles('.github/codeql/codeql-config.yml') != '' && './.github/codeql/codeql-config.yml' || '' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
