name: Distribute Secrets to All Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

permissions: write-all

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    name: Distribute secrets to all owned repos

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify workflow env matches repo secrets
        env:
          # BEGIN DISTRIBUTE_SECRETS_ENV (generated by setup.py --sync-workflow)
          GITHUB_TOKEN: ${{ secrets.PROFILE_HOOK }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GNOME_PASSWORD: ${{ secrets.GNOME_PASSWORD }}
          GNOME_USERNAME: ${{ secrets.GNOME_USERNAME }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PLING_PASSWORD: ${{ secrets.PLING_PASSWORD }}
          PLING_USERNAME: ${{ secrets.PLING_USERNAME }}
          PROFILE_HOOK: ${{ secrets.PROFILE_HOOK }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ISSUES_CHAT_ID: ${{ secrets.TELEGRAM_ISSUES_CHAT_ID }}
          TELEGRAM_MAINTAINER_CHAT_ID: ${{ secrets.TELEGRAM_MAINTAINER_CHAT_ID }}
          TELEGRAM_PR_CHAT_ID: ${{ secrets.TELEGRAM_PR_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WORDPRESS_APPLICATION: ${{ secrets.WORDPRESS_APPLICATION }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          YOUTUBE_API: ${{ secrets.YOUTUBE_API }}
          # END DISTRIBUTE_SECRETS_ENV
        run: python3 setup.py

      - name: Report completion
        run: |
          echo "Secret distribution completed!"
          echo "Check the logs above for any errors or repos that were skipped."
