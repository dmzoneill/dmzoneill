name: CICD

on:
  repository_dispatch:
  push:
  schedule:
    - cron: '0 */6 * * *'
    
permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    name: Run linter
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python packages for pylint
        # Super-linter does not install project dependencies; put them in the
        # runner home that is mounted into its container as /github/home.
        run: pip install --target "$RUNNER_TEMP/_github_home/lint-deps" requests types-requests

      - name: Lint Code Base
        uses: super-linter/super-linter@v9
        env:
          PYTHONPATH: /github/home/lint-deps
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_MARKDOWN: false
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Update Profile
    needs: run-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update profile
        env:
          ghtoken: ${{ secrets.PUBLISH }}
        run: |-
          python updater.py

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated publish: $(date -u) ${{ github.sha }}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git push origin main
          else
            echo "Skipping profile push from ${GITHUB_REF}"
          fi
