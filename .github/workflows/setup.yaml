name: CICD_REPOS_SETUP

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  setup-repos:
    runs-on: ubuntu-latest
    name: Setup repos
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: bash setup.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_HOOK: ${{ secrets.PROFILE_HOOK }}
          DISTRIBUTE_SECURITY_WORKFLOWS: ${{ vars.DISTRIBUTE_SECURITY_WORKFLOWS }}
