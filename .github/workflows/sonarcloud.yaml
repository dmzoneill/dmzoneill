name: SonarCloud Analysis (reusable)

# Called by the sonarcloud.yml stub that setup.sh distributes to each repo.
# Project key defaults to <owner>_<repo> and organization to <owner>, matching
# the SonarCloud GitHub import. Override with SONAR_PROJECT_KEY /
# SONAR_ORGANIZATION repo variables or a sonar-project.properties file.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for SonarCloud token
        id: check_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::SONAR_TOKEN is not available; SonarCloud scan skipped."
          fi

      - name: SonarCloud Scan
        if: steps.check_token.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
